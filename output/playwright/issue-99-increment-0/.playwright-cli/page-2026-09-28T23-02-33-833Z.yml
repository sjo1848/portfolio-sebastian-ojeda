    - region [ref=e185]:
      - generic [ref=e186]:
        - heading "A little about me" [level=2] [ref=e188]
        - generic [ref=e190]:
          - paragraph [ref=e191]: "I live in Uspallata, Mendoza, Argentina. Before focusing on software development, I worked across technical support, infrastructure, SAP and integrations in different operational environments. That path gradually shaped how I think about technology: I learned to see it as a tool for understanding, connecting and improving real processes without losing sight of the people who make them work."
          - paragraph [ref=e192]: "I especially enjoy the discovery stage and the work of understanding the problem. I find it deeply satisfying to step into something that is still unclear, ask the right questions and start making sense of what is actually happening: why a process works the way it does, where friction appears and what the person using it really needs. From there, technology starts to make sense. To me, a good solution begins with understanding the problem well before writing the first line of code."
          - paragraph [ref=e193]: Learning is a constant in my life. I am always going deeper into something, discovering a tool, entering a new domain or trying to look at a problem from another angle. I might be studying software architecture, data or SAP and then spend time learning a completely new language. What drives me is not collecting technologies, but the satisfaction of understanding something I did not understand before and finding new ways to think, build and make things better.
          - paragraph [ref=e194]: "Away from the screen, the mountains are an important part of my life. I enjoy running, hiking, exploring and being close to an environment that contrasts with spending hours building systems. Choosing to live in Uspallata has a lot to do with that: being able to build technology without losing touch with the real world, nature and the things that keep my curiosity alive."
