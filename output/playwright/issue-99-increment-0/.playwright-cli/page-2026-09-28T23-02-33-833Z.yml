        - generic [ref=e221]:
          - paragraph [ref=e222]: "My background includes SAP Basis, SAP PI/PO integrations and operational processes. That context shapes how I design software: I consider actors, exceptions, permissions, traceability, continuity and data quality from the beginning."
          - paragraph [ref=e223]: I add AI when it provides a concrete advantage. I combine models and agents with APIs, data, interfaces, policies, Human-in-the-Loop, testing, CI/CD and observability so automation operates within explicit boundaries.
