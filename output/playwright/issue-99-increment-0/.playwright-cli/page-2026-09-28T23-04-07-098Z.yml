        - generic [ref=f7e54]:
          - heading "Un agente conectado a operaciones reales sin convertir al modelo en autoridad" [level=2] [ref=f7e55]
          - paragraph [ref=f7e56]: Esta es la historia principal del portfolio porque el problema no es “hacer un chatbot”. El problema es permitir que un modelo entienda lenguaje natural y opere sobre un sistema hotelero real sin poder inventar permisos, contexto confiable o efectos laterales.
          - paragraph [ref=f7e57]: AI Commerce Platform conecta una experiencia conversacional con HMS. El LLM interpreta intención, contexto y ambigüedad; el Agent Core conserva la autoridad de ejecución.
          - paragraph [ref=f7e58]:
            - code [ref=f7e59]: Channel → ChatOrchestrator → ModelRouter → AgentCoreExecutor → ToolRegistry → PolicyEngine → Adapter → HMS
          - heading "Qué puede hacer el modelo y qué no" [level=2] [ref=f7e60]
          - paragraph [ref=f7e61]: "El modelo puede:"
          - list [ref=f7e62]:
            - listitem [ref=f7e63]: interpretar pedidos naturales;
            - listitem [ref=f7e64]: mantener contexto conversacional controlado;
            - listitem [ref=f7e65]: proponer planes estructurados de tools;
            - listitem [ref=f7e66]: pedir aclaraciones;
            - listitem [ref=f7e67]: redactar respuestas basadas en resultados reales.
          - paragraph [ref=f7e68]: "El modelo no puede:"
          - list [ref=f7e69]:
            - listitem [ref=f7e70]: elegir el tenant, hotel o actor confiable;
            - listitem [ref=f7e71]: elevar permisos;
            - listitem [ref=f7e72]: acceder directamente a la base de datos;
            - listitem [ref=f7e73]: inventar metadata de aprobación;
            - listitem [ref=f7e74]: crear tokens de operación arbitrarios;
            - listitem [ref=f7e75]: saltar la revalidación server-side.
          - paragraph [ref=f7e76]:
            - text: La separación entre
            - strong [ref=f7e77]: inteligencia
            - text: "y"
            - strong [ref=f7e78]: autoridad
            - text: es la decisión arquitectónica central.
          - heading "Evidencia operacional alcanzada" [level=2] [ref=f7e79]
          - paragraph [ref=f7e80]: "La fase 2.5 cerró la prueba de operaciones HMS en staging con:"
          - list [ref=f7e81]:
            - listitem [ref=f7e82]: disponibilidad y cotización reales mediante Service Binding;
            - listitem [ref=f7e83]: creación controlada de reservas;
            - listitem [ref=f7e84]: cancelación controlada;
            - listitem [ref=f7e85]: aprobación Human-in-the-Loop ligada a la operación exacta;
            - listitem [ref=f7e86]: challenges de aprobación durables;
            - listitem [ref=f7e87]: ownership de reservas;
            - listitem [ref=f7e88]: semántica de replay y conflicto;
            - listitem [ref=f7e89]: retiro y restauración de inventario;
            - listitem [ref=f7e90]: auditoría e idempotencia;
            - listitem [ref=f7e91]: E2E sintético entre repositorios con cleanup.
          - paragraph [ref=f7e92]:
            - text: La fase actual, 2.6, no se presenta como cerrada. Está reemplazando el parser determinista como experiencia primaria por un
            - code [ref=f7e93]: LLMModelRouter
            - text: independiente del proveedor, manteniendo el router determinista como fallback y fixture reproducible.
          - heading "Por qué esto es AI-first y no AI-only" [level=2] [ref=f7e94]
          - paragraph [ref=f7e95]: "La IA se usa donde tiene ventaja: lenguaje, contexto, ambigüedad y composición. Los elementos que requieren certeza siguen siendo deterministas:"
          - list [ref=f7e96]:
            - listitem [ref=f7e97]: tools registradas;
            - listitem [ref=f7e98]: políticas y permisos;
            - listitem [ref=f7e99]: identidad y contexto confiable;
            - listitem [ref=f7e100]: idempotencia;
            - listitem [ref=f7e101]: aprobaciones;
            - listitem [ref=f7e102]: auditoría;
            - listitem [ref=f7e103]: estado operacional de HMS.
          - paragraph [ref=f7e104]: La capacidad importante no es “usar un LLM”; es decidir qué responsabilidad darle y qué responsabilidad negarle.
          - heading "Qué demuestra esta historia" [level=2] [ref=f7e105]
          - list [ref=f7e106]:
            - listitem [ref=f7e107]: integración de LLMs con un sistema operacional existente;
            - listitem [ref=f7e108]: tool calling gobernado y revalidado en servidor;
            - listitem [ref=f7e109]: Human-in-the-Loop para side effects sensibles;
            - listitem [ref=f7e110]: multi-tenancy y contexto confiable fuera del prompt;
            - listitem [ref=f7e111]: idempotencia, replay y auditabilidad;
            - listitem [ref=f7e112]: model routing y fallback determinista;
            - listitem [ref=f7e113]: evaluación adversarial y gates de producto;
            - listitem [ref=f7e114]: una frontera explícita entre interpretación probabilística y autoridad operacional.
