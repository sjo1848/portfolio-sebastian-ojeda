        - generic [ref=f5e77]:
          - heading "Problema" [level=2] [ref=f5e78]
          - paragraph [ref=f5e79]: Un catálogo de alojamientos no se resuelve mostrando tarjetas. También necesita controlar quién puede editar una ficha, cuándo una publicación queda aprobada, si la disponibilidad sigue vigente y cómo llega una consulta al propietario correcto sin exponer datos internos.
          - paragraph [ref=f5e80]: Alquileres Uspallata aborda ese recorrido como un sistema full stack con catálogo público, workflows privados para propietarios y administración, disponibilidad con marca temporal y auditoría de acciones sensibles.
          - heading "Contexto y restricciones" [level=2] [ref=f5e81]
          - paragraph [ref=f5e82]: El dominio combina información pública y operación privada. Una ficha visible debe atravesar revisión y publicación explícitas, mientras que la disponibilidad puede quedar desactualizada aunque la ficha siga publicada.
          - paragraph [ref=f5e83]: "Las restricciones principales fueron:"
          - list [ref=f5e84]:
            - listitem [ref=f5e85]: separar propiedad, revisión y publicación;
            - listitem [ref=f5e86]: derivar al propietario desde la sesión autenticada;
            - listitem [ref=f5e87]: no aceptar identidad arbitraria enviada por el cliente;
            - listitem [ref=f5e88]: exponer solo campos permitidos en rutas públicas;
            - listitem [ref=f5e89]: conservar motivos de rechazo y acciones administrativas;
            - listitem [ref=f5e90]: no presentar disponibilidad vieja como disponibilidad confirmada actual.
          - heading "Arquitectura" [level=2] [ref=f5e91]
          - paragraph [ref=f5e92]: La API NestJS organiza autenticación, propietarios, listados, revisión, contacto y auditoría. Prisma y PostgreSQL sostienen el modelo transaccional. Vue consume rutas diferenciadas para la experiencia pública, el propietario y la administración.
          - paragraph [ref=f5e93]: El sistema separa campos públicos de ownership, almacenamiento, revisión y auditoría. Las operaciones privadas obtienen el contexto de propietario desde la sesión y las acciones administrativas quedan asociadas a actor, acción, entidad, propietario objetivo y fecha.
          - heading "Decisiones de ingeniería" [level=2] [ref=f5e94]
          - paragraph [ref=f5e95]:
            - strong [ref=f5e96]: Revisión y publicación son estados distintos.
            - text: Una ficha puede pasar de
            - code [ref=f5e97]: DRAFT
            - text: a
            - code [ref=f5e98]: SUBMITTED
            - text: ", luego a"
            - code [ref=f5e99]: APPROVED
            - text: o
            - code [ref=f5e100]: REJECTED
            - text: ; solo una ficha aprobada puede publicarse. Editar o revisar no implica hacer visible la publicación.
          - paragraph [ref=f5e101]:
            - strong [ref=f5e102]: Disponibilidad con frescura explícita.
            - text: El estado de disponibilidad guarda una fecha de última confirmación para diferenciar información reciente de información potencialmente obsoleta.
          - paragraph [ref=f5e103]:
            - strong [ref=f5e104]: Autoridad del servidor.
            - text: El navegador no decide qué propietario modifica una ficha ni qué datos internos se exponen.
          - paragraph [ref=f5e105]:
            - strong [ref=f5e106]: Auditoría de acciones asistidas.
            - text: Las operaciones administrativas relevantes dejan una traza asociada al actor y a la entidad afectada.
          - heading "Implementación" [level=2] [ref=f5e107]
          - paragraph [ref=f5e108]: "El flujo implementado cubre:"
          - list [ref=f5e109]:
            - listitem [ref=f5e110]: borradores y envío a revisión;
            - listitem [ref=f5e111]: aprobación o rechazo con motivo persistido;
            - listitem [ref=f5e112]: publicación controlada;
            - listitem [ref=f5e113]: catálogo público paginado con filtros;
            - listitem [ref=f5e114]: ficha pública con disponibilidad;
            - listitem [ref=f5e115]: contacto directo al propietario correcto;
            - listitem [ref=f5e116]: acciones administrativas con auditoría.
          - paragraph [ref=f5e117]: El stack principal combina NestJS, Vue, TypeScript, Prisma y PostgreSQL, con separación clara entre API, persistencia y experiencia de usuario.
          - heading "QA y validación" [level=2] [ref=f5e118]
          - paragraph [ref=f5e119]: El repositorio incluye migraciones versionadas, pruebas de API y guards, lint, build, validación de secretos y smoke test de salud. Los checkpoints documentados cubren catálogo, revisión, disponibilidad, contacto y auditoría.
          - paragraph [ref=f5e120]: La validación prioriza especialmente límites de autorización, respuestas públicas sin datos internos y consistencia de las transiciones de estado.
          - heading "Resultado actual" [level=2] [ref=f5e121]
          - paragraph [ref=f5e122]: El núcleo del producto está implementado y en desarrollo activo. La plataforma ya modela el recorrido completo desde creación y revisión de una ficha hasta publicación, consulta pública y contacto, sin mezclar autoridad del cliente con autoridad del servidor.
          - heading "Evidencia y límites" [level=2] [ref=f5e123]
          - paragraph [ref=f5e124]: La evidencia disponible está en el repositorio, las pruebas y el caso documentado. Siguen pendientes una instancia pública verificable y evidencia visual definitiva de catálogo, ficha pública, revisión/publicación y auditoría administrativa.
          - paragraph [ref=f5e125]:
            - text: El alcance actual
            - strong [ref=f5e126]: no incluye
            - text: reservas, pagos, realtime, notificaciones, turismo completo ni despliegue productivo público. Por eso la demo permanece sin URL y el proyecto se presenta como desarrollo activo, no como producto terminado en producción.
