          - heading "Current result" [level=2] [ref=f2e125]
          - paragraph [ref=f2e126]: The migration reached technical validation while preserving an explicit separation between technical acceptance and product acceptance. The case demonstrates continuity between a Rust/PostgreSQL backend and an edge/serverless architecture instead of presenting the latter as disconnected from the original domain.
          - heading "Evidence and limits" [level=2] [ref=f2e127]
          - paragraph [ref=f2e128]: Available evidence covers code, migration contracts, automated tests, browser journeys, Playwright screenshots, and recovery rehearsal. Remote reception screenshots, final mobile visual evidence, and remote Product Acceptance evidence remain pending.
          - paragraph [ref=f2e129]:
            - text: The published status is therefore
            - strong [ref=f2e130]: technically validated migration; acceptance remains separate
            - text: . It is not presented as a final production release.
