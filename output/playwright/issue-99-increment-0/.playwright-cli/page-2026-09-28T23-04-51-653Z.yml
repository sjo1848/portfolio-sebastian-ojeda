        - generic [ref=f2e60]:
          - heading "Problem" [level=2] [ref=f2e61]
          - paragraph [ref=f2e62]: HMS Cloudflare did not start as a new serverless application. It is the evolution of a hotel-management system that already modeled bookings, reception, rooms, guests, housekeeping, billing, permissions, and multi-hotel operations.
          - paragraph [ref=f2e63]: The problem was to change infrastructure and data topology without silently changing the product. Moving from Rust + Axum + PostgreSQL to Workers, Hono, and D1 required preserving states, permissions, hotel isolation, and observable behavior while also proving backup and recovery in a verifiable way.
          - heading "Context and constraints" [level=2] [ref=f2e64]
          - paragraph [ref=f2e65]: "The technical sequence is:"
          - paragraph [ref=f2e66]:
            - code [ref=f2e67]: HMS Elite / Rust + Axum + PostgreSQL → contract inventory → parity-first migration → Workers + Hono + D1 → product and recovery validation → Agent Core as a later layer
          - paragraph [ref=f2e68]: "The work was constrained by several concrete requirements:"
          - list [ref=f2e69]:
            - listitem [ref=f2e70]: preserve reception-facing state transitions;
            - listitem [ref=f2e71]: retain membership and permission semantics;
            - listitem [ref=f2e72]: replace PostgreSQL RLS without losing tenant isolation;
            - listitem [ref=f2e73]: avoid claiming distributed atomicity where D1 does not provide it;
            - listitem [ref=f2e74]: validate real browser journeys rather than compilation alone;
            - listitem [ref=f2e75]: keep Technical PASS, Product Acceptance, Production Readiness, and Release as separate gates.
          - heading "Architecture" [level=2] [ref=f2e76]
          - paragraph [ref=f2e77]: "The active architecture separates two responsibilities:"
          - list [ref=f2e78]:
            - listitem [ref=f2e79]:
              - code [ref=f2e80]: CONTROL_DB
              - text: ": identities, hotels, memberships, roles, and routing;"
            - listitem [ref=f2e81]: "one operational D1 per hotel: bookings, rooms, guests, billing, housekeeping, and audit."
          - paragraph [ref=f2e82]: Every request validates identity, membership, role, and context before resolving the corresponding operational database. Physical separation reduces blast radius, but it does not replace authorization.
          - paragraph [ref=f2e83]: Cloudflare Access authenticates at the edge; the API validates that identity and HMS applies business authority. Those are intentionally different layers.
          - heading "Engineering decisions" [level=2] [ref=f2e84]
          - paragraph [ref=f2e85]:
            - strong [ref=f2e86]: Parity-first before redesign.
            - text: The migration preserves the observable contract before introducing new capabilities.
          - paragraph [ref=f2e87]:
            - strong [ref=f2e88]: Local atomicity.
            - text: Critical operations stay inside one hotel’s D1 whenever transactional consistency matters. The architecture does not pretend a nonexistent distributed transaction exists.
          - paragraph [ref=f2e89]:
            - strong [ref=f2e90]: Explicit authority.
            - text: Access handles infrastructure authentication; memberships and RBAC handle business authority.
          - paragraph [ref=f2e91]:
            - strong [ref=f2e92]: Recovery as tested behavior.
            - text: A backup is not treated as sufficient evidence until it is restored and the resulting state is reconciled.
          - heading "Implementation" [level=2] [ref=f2e93]
          - paragraph [ref=f2e94]: "The migration was decomposed into verifiable increments: foundation, source-contract inventory, rooms/guests/bookings, reception, housekeeping, maintenance, billing, security, administration, reporting, and operational readiness."
          - paragraph [ref=f2e95]: The work spans backend, data, interfaces, security, and infrastructure. HMS Elite provides the source contract; HMS Cloudflare implements the new runtime and topology; Agent Core remains a separate repository and gate and integrates only over an explicit operational boundary.
          - heading "QA and validation" [level=2] [ref=f2e96]
          - paragraph [ref=f2e97]: "Validation combines:"
          - list [ref=f2e98]:
            - listitem [ref=f2e99]: type checking plus unit and integration tests;
            - listitem [ref=f2e100]: targeted domain regressions;
            - listitem [ref=f2e101]: browser journeys;
            - listitem [ref=f2e102]: RBAC and tenant-isolation checks;
            - listitem [ref=f2e103]: failure paths and concurrency;
            - listitem [ref=f2e104]: migration and backup/restore;
            - listitem [ref=f2e105]: independent review.
          - paragraph [ref=f2e106]: The recovery rehearsal exports the databases, introduces synthetic mutations, restores the backup, and verifies checksums and reconciliation. It is presented as local recovery evidence, not as proof of remote atomic rollback across D1 databases.
          - heading "Visual evidence" [level=2] [ref=f2e107]
          - paragraph [ref=f2e108]: The following screenshots are versioned in the repository and come from Playwright regressions against the migrated runtime. They document reproducible local behavior; they are not presented as remote acceptance or production proof.
