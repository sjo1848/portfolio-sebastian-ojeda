        - generic [ref=f3e54]:
          - heading "Problema" [level=2] [ref=f3e55]
          - paragraph [ref=f3e56]: HMS Cloudflare no nació como una aplicación serverless nueva. Es la evolución de un sistema de gestión hotelera que ya modelaba reservas, recepción, habitaciones, huéspedes, housekeeping, facturación, permisos y operación multi-hotel.
          - paragraph [ref=f3e57]: El problema era cambiar infraestructura y topología de datos sin cambiar silenciosamente el producto. Migrar de Rust + Axum + PostgreSQL hacia Workers, Hono y D1 exigía conservar estados, permisos, aislamiento entre hoteles y comportamiento observable, además de demostrar que backup y recovery funcionaban de forma verificable.
          - heading "Contexto y restricciones" [level=2] [ref=f3e58]
          - paragraph [ref=f3e59]: "La secuencia técnica es:"
          - paragraph [ref=f3e60]:
            - code [ref=f3e61]: HMS Elite / Rust + Axum + PostgreSQL → inventario del contrato → migración parity-first → Workers + Hono + D1 → validación de producto y recovery → Agent Core como capa posterior
          - paragraph [ref=f3e62]: "Las restricciones que guiaron el trabajo fueron concretas:"
          - list [ref=f3e63]:
            - listitem [ref=f3e64]: preservar las transiciones de estado utilizadas por recepción;
            - listitem [ref=f3e65]: mantener la semántica de permisos y memberships;
            - listitem [ref=f3e66]: reemplazar PostgreSQL RLS sin perder aislamiento multi-tenant;
            - listitem [ref=f3e67]: evitar prometer atomicidad distribuida donde D1 no la ofrece;
            - listitem [ref=f3e68]: validar recorridos reales de navegador, no solo compilación;
            - listitem [ref=f3e69]: distinguir Technical PASS, Product Acceptance, Production Readiness y Release.
          - heading "Arquitectura" [level=2] [ref=f3e70]
          - paragraph [ref=f3e71]: "La arquitectura activa separa dos responsabilidades:"
          - list [ref=f3e72]:
            - listitem [ref=f3e73]:
              - code [ref=f3e74]: CONTROL_DB
              - text: ": identidades, hoteles, memberships, roles y routing;"
            - listitem [ref=f3e75]: "un D1 operacional por hotel: reservas, habitaciones, huéspedes, billing, housekeeping y auditoría."
          - paragraph [ref=f3e76]: Cada request valida identidad, membership, rol y contexto antes de resolver la base operacional correspondiente. La separación física de datos reduce el radio de impacto, pero no reemplaza autorización.
          - paragraph [ref=f3e77]: Cloudflare Access autentica en el edge; la API valida esa identidad y HMS aplica la autoridad de negocio. Son capas distintas y se mantienen separadas intencionalmente.
          - heading "Decisiones de ingeniería" [level=2] [ref=f3e78]
          - paragraph [ref=f3e79]:
            - strong [ref=f3e80]: Parity-first antes que rediseño.
            - text: La migración prioriza conservar el contrato observable antes de introducir nuevas capacidades.
          - paragraph [ref=f3e81]:
            - strong [ref=f3e82]: Atomicidad local.
            - text: Las operaciones críticas permanecen dentro del D1 de un hotel cuando la consistencia transaccional importa. No se simula una transacción distribuida inexistente.
          - paragraph [ref=f3e83]:
            - strong [ref=f3e84]: Autoridad explícita.
            - text: Access resuelve autenticación de infraestructura; memberships y RBAC resuelven autoridad de negocio.
          - paragraph [ref=f3e85]:
            - strong [ref=f3e86]: Recovery como comportamiento probado.
            - text: Un backup no se considera evidencia suficiente hasta restaurarlo y reconciliar el estado resultante.
          - heading "Implementación" [level=2] [ref=f3e87]
          - paragraph [ref=f3e88]: "La migración se dividió en incrementos verificables: foundation, inventario del contrato, rooms/guests/bookings, recepción, housekeeping, mantenimiento, billing, seguridad, administración, reporting y readiness operacional."
          - paragraph [ref=f3e89]: El trabajo conecta backend, datos, interfaces, seguridad e infraestructura. HMS Elite aporta el contrato fuente; HMS Cloudflare implementa el nuevo runtime y la nueva topología; Agent Core pertenece a otro repositorio y otro gate, y se integra solo sobre una frontera operacional explícita.
          - heading "QA y validación" [level=2] [ref=f3e90]
          - paragraph [ref=f3e91]: "La validación combina:"
          - list [ref=f3e92]:
            - listitem [ref=f3e93]: typecheck y tests unitarios/integración;
            - listitem [ref=f3e94]: regresiones específicas de dominio;
            - listitem [ref=f3e95]: browser journeys;
            - listitem [ref=f3e96]: checks RBAC y tenant isolation;
            - listitem [ref=f3e97]: failure paths y concurrencia;
            - listitem [ref=f3e98]: migración y backup/restore;
            - listitem [ref=f3e99]: Independent Review.
          - paragraph [ref=f3e100]: El rehearsal de recovery exporta las bases, introduce mutaciones sintéticas, restaura el backup y verifica checksums y reconciliación. Se presenta como evidencia local de recuperación, no como prueba de rollback atómico remoto entre bases D1.
          - heading "Evidencia visual" [level=2] [ref=f3e101]
          - paragraph [ref=f3e102]: Las capturas siguientes están versionadas en el repositorio y provienen de regresiones Playwright sobre el runtime migrado. Documentan comportamiento local reproducible; no se presentan como aceptación remota ni como prueba de producción.
          - link [ref=f3e103] [cursor=pointer]:
            - /url: /media/projects/hms-cloudflare/cf-i04-reception-authorized.png
            - img "Flujo de recepción de HMS Cloudflare" [ref=f3e104]
          - paragraph [ref=f3e105]:
