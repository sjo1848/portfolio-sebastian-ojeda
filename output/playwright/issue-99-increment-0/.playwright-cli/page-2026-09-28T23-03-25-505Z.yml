          - paragraph [ref=f3e117]:
            - emphasis [ref=f3e118]: "Administración: workspace actual de accesos y roles capturado por Playwright."
          - heading "Resultado actual" [level=2] [ref=f3e119]
          - paragraph [ref=f3e120]: La migración alcanzó validación técnica y conserva una separación explícita entre aceptación técnica y aceptación de producto. El caso demuestra continuidad entre un backend Rust/PostgreSQL y una arquitectura edge/serverless sin presentar la segunda como un sistema independiente del dominio original.
          - heading "Evidencia y límites" [level=2] [ref=f3e121]
          - paragraph [ref=f3e122]: La evidencia disponible cubre código, contrato de migración, pruebas automatizadas, recorridos de navegador, capturas Playwright y rehearsal de recovery. Permanecen pendientes capturas remotas del recorrido de recepción, evidencia visual mobile del candidato aceptado y evidencia remota de Product Acceptance.
          - paragraph [ref=f3e123]:
            - text: Por eso el estado publicado es
            - strong [ref=f3e124]: migración validada técnicamente; aceptación separada
            - text: . No se presenta como release productivo final.
