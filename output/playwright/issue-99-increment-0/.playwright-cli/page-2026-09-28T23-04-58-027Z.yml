      - generic [ref=f3e55]:
        - complementary [ref=f3e57]:
          - group [ref=f3e58]:
            - generic "Contenido" [ref=f3e59] [cursor=pointer]
        - generic [ref=f3e60]:
          - heading "Problema" [level=2] [ref=f3e61]
          - paragraph [ref=f3e62]: HMS Cloudflare no nació como una aplicación serverless nueva. Es la evolución de un sistema de gestión hotelera que ya modelaba reservas, recepción, habitaciones, huéspedes, housekeeping, facturación, permisos y operación multi-hotel.
          - paragraph [ref=f3e63]: El problema era cambiar infraestructura y topología de datos sin cambiar silenciosamente el producto. Migrar de Rust + Axum + PostgreSQL hacia Workers, Hono y D1 exigía conservar estados, permisos, aislamiento entre hoteles y comportamiento observable, además de demostrar que backup y recovery funcionaban de forma verificable.
          - heading "Contexto y restricciones" [level=2] [ref=f3e64]
          - paragraph [ref=f3e65]: "La secuencia técnica es:"
          - paragraph [ref=f3e66]:
            - code [ref=f3e67]: HMS Elite / Rust + Axum + PostgreSQL → inventario del contrato → migración parity-first → Workers + Hono + D1 → validación de producto y recovery → Agent Core como capa posterior
          - paragraph [ref=f3e68]: "Las restricciones que guiaron el trabajo fueron concretas:"
          - list [ref=f3e69]:
            - listitem [ref=f3e70]: preservar las transiciones de estado utilizadas por recepción;
            - listitem [ref=f3e71]: mantener la semántica de permisos y memberships;
            - listitem [ref=f3e72]: reemplazar PostgreSQL RLS sin perder aislamiento multi-tenant;
            - listitem [ref=f3e73]: evitar prometer atomicidad distribuida donde D1 no la ofrece;
            - listitem [ref=f3e74]: validar recorridos reales de navegador, no solo compilación;
            - listitem [ref=f3e75]: distinguir Technical PASS, Product Acceptance, Production Readiness y Release.
          - heading "Arquitectura" [level=2] [ref=f3e76]
          - paragraph [ref=f3e77]: "La arquitectura activa separa dos responsabilidades:"
          - list [ref=f3e78]:
            - listitem [ref=f3e79]:
              - code [ref=f3e80]: CONTROL_DB
              - text: ": identidades, hoteles, memberships, roles y routing;"
            - listitem [ref=f3e81]: "un D1 operacional por hotel: reservas, habitaciones, huéspedes, billing, housekeeping y auditoría."
          - paragraph [ref=f3e82]: Cada request valida identidad, membership, rol y contexto antes de resolver la base operacional correspondiente. La separación física de datos reduce el radio de impacto, pero no reemplaza autorización.
          - paragraph [ref=f3e83]: Cloudflare Access autentica en el edge; la API valida esa identidad y HMS aplica la autoridad de negocio. Son capas distintas y se mantienen separadas intencionalmente.
          - heading "Decisiones de ingeniería" [level=2] [ref=f3e84]
          - paragraph [ref=f3e85]:
            - strong [ref=f3e86]: Parity-first antes que rediseño.
            - text: La migración prioriza conservar el contrato observable antes de introducir nuevas capacidades.
          - paragraph [ref=f3e87]:
            - strong [ref=f3e88]: Atomicidad local.
            - text: Las operaciones críticas permanecen dentro del D1 de un hotel cuando la consistencia transaccional importa. No se simula una transacción distribuida inexistente.
          - paragraph [ref=f3e89]:
            - strong [ref=f3e90]: Autoridad explícita.
            - text: Access resuelve autenticación de infraestructura; memberships y RBAC resuelven autoridad de negocio.
          - paragraph [ref=f3e91]:
            - strong [ref=f3e92]: Recovery como comportamiento probado.
            - text: Un backup no se considera evidencia suficiente hasta restaurarlo y reconciliar el estado resultante.
          - heading "Implementación" [level=2] [ref=f3e93]
          - paragraph [ref=f3e94]: "La migración se dividió en incrementos verificables: foundation, inventario del contrato, rooms/guests/bookings, recepción, housekeeping, mantenimiento, billing, seguridad, administración, reporting y readiness operacional."
          - paragraph [ref=f3e95]: El trabajo conecta backend, datos, interfaces, seguridad e infraestructura. HMS Elite aporta el contrato fuente; HMS Cloudflare implementa el nuevo runtime y la nueva topología; Agent Core pertenece a otro repositorio y otro gate, y se integra solo sobre una frontera operacional explícita.
          - heading "QA y validación" [level=2] [ref=f3e96]
          - paragraph [ref=f3e97]: "La validación combina:"
          - list [ref=f3e98]:
            - listitem [ref=f3e99]: typecheck y tests unitarios/integración;
            - listitem [ref=f3e100]: regresiones específicas de dominio;
            - listitem [ref=f3e101]: browser journeys;
            - listitem [ref=f3e102]: checks RBAC y tenant isolation;
            - listitem [ref=f3e103]: failure paths y concurrencia;
            - listitem [ref=f3e104]: migración y backup/restore;
            - listitem [ref=f3e105]: Independent Review.
          - paragraph [ref=f3e106]: El rehearsal de recovery exporta las bases, introduce mutaciones sintéticas, restaura el backup y verifica checksums y reconciliación. Se presenta como evidencia local de recuperación, no como prueba de rollback atómico remoto entre bases D1.
          - heading "Evidencia visual" [level=2] [ref=f3e107]
          - paragraph [ref=f3e108]: Las capturas siguientes están versionadas en el repositorio y provienen de regresiones Playwright sobre el runtime migrado. Documentan comportamiento local reproducible; no se presentan como aceptación remota ni como prueba de producción.
          - link [ref=f3e109] [cursor=pointer]:
            - /url: /media/projects/hms-cloudflare/cf-i04-reception-authorized.png
            - img "Flujo de recepción de HMS Cloudflare" [ref=f3e110]
          - paragraph [ref=f3e111]:
            - emphasis [ref=f3e112]: "Recepción: ciclo operacional capturado durante la regresión del proyecto."
          - link [ref=f3e113] [cursor=pointer]:
            - /url: /media/projects/hms-cloudflare/cf-i05-housekeeping-authorized.png
            - img "Workspace de housekeeping de HMS Cloudflare" [ref=f3e114]
          - paragraph [ref=f3e115]:
            - emphasis [ref=f3e116]: "Housekeeping: evidencia del workspace integrado sobre la migración Cloudflare."
          - link [ref=f3e117] [cursor=pointer]:
            - /url: /media/projects/hms-cloudflare/cf-i06-billing-authorized.png
            - img "Flujo de facturación de HMS Cloudflare" [ref=f3e118]
          - paragraph [ref=f3e119]:
            - emphasis [ref=f3e120]: "Billing: comportamiento de producto capturado por Playwright; no implica Product Acceptance remota."
          - link [ref=f3e121] [cursor=pointer]:
            - /url: /media/projects/hms-cloudflare/cf-i07-admin-authorized.png
            - img "Workspace administrativo de HMS Cloudflare" [ref=f3e122]
          - paragraph [ref=f3e123]:
            - emphasis [ref=f3e124]: "Administración: workspace actual de accesos y roles capturado por Playwright."
          - heading "Resultado actual" [level=2] [ref=f3e125]
          - paragraph [ref=f3e126]: La migración alcanzó validación técnica y conserva una separación explícita entre aceptación técnica y aceptación de producto. El caso demuestra continuidad entre un backend Rust/PostgreSQL y una arquitectura edge/serverless sin presentar la segunda como un sistema independiente del dominio original.
          - heading "Evidencia y límites" [level=2] [ref=f3e127]
          - paragraph [ref=f3e128]: La evidencia disponible cubre código, contrato de migración, pruebas automatizadas, recorridos de navegador, capturas Playwright y rehearsal de recovery. Permanecen pendientes capturas remotas del recorrido de recepción, evidencia visual mobile del candidato aceptado y evidencia remota de Product Acceptance.
          - paragraph [ref=f3e129]:
            - text: Por eso el estado publicado es
            - strong [ref=f3e130]: migración validada técnicamente; aceptación separada
            - text: . No se presenta como release productivo final.
