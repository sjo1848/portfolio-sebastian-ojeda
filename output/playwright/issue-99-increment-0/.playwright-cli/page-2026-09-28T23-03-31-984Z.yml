        - generic [ref=f4e77]:
          - heading "Problem" [level=2] [ref=f4e78]
          - paragraph [ref=f4e79]: A vacation-rental catalog is not solved by displaying cards alone. It also needs to control who can edit a listing, when publication is approved, whether availability is still current, and how a visitor inquiry reaches the correct owner without exposing internal data.
          - paragraph [ref=f4e80]: Alquileres Uspallata addresses that journey as a full-stack system with a public catalog, private owner and administration workflows, timestamped availability, and auditability for sensitive actions.
          - heading "Context and constraints" [level=2] [ref=f4e81]
          - paragraph [ref=f4e82]: The domain combines public information with private operations. A visible listing must pass explicit review and publication steps, while availability can become stale even if the listing remains published.
          - paragraph [ref=f4e83]: "The main constraints were:"
          - list [ref=f4e84]:
            - listitem [ref=f4e85]: separate ownership, review, and publication;
            - listitem [ref=f4e86]: derive the owner from the authenticated session;
            - listitem [ref=f4e87]: never trust arbitrary owner identity sent by the client;
            - listitem [ref=f4e88]: expose only allowed fields through public routes;
            - listitem [ref=f4e89]: preserve rejection reasons and administrative actions;
            - listitem [ref=f4e90]: avoid presenting stale availability as currently confirmed availability.
          - heading "Architecture" [level=2] [ref=f4e91]
          - paragraph [ref=f4e92]: The NestJS API organizes authentication, owners, listings, review, contact, and auditing. Prisma and PostgreSQL support the transactional model. Vue consumes separate routes for the public experience, owner workflows, and administration.
          - paragraph [ref=f4e93]: The system separates public fields from ownership, storage, review, and audit data. Private operations derive owner context from the session, and administrative actions are associated with actor, action, entity, target owner, and timestamp.
          - heading "Engineering decisions" [level=2] [ref=f4e94]
          - paragraph [ref=f4e95]:
            - strong [ref=f4e96]: Review and publication are separate states.
            - text: A listing can move from
            - code [ref=f4e97]: DRAFT
            - text: to
            - code [ref=f4e98]: SUBMITTED
            - text: ", then to"
            - code [ref=f4e99]: APPROVED
            - text: or
            - code [ref=f4e100]: REJECTED
            - text: ; only an approved listing can be published. Editing or reviewing does not automatically make a listing visible.
          - paragraph [ref=f4e101]:
            - strong [ref=f4e102]: Availability has explicit freshness.
            - text: Availability stores a last-confirmed timestamp so the UI can distinguish fresh information from potentially stale information.
          - paragraph [ref=f4e103]:
            - strong [ref=f4e104]: Server-side authority.
            - text: The browser does not decide which owner controls a listing or which internal fields become public.
          - paragraph [ref=f4e105]:
            - strong [ref=f4e106]: Auditable assisted actions.
            - text: Relevant administrative operations leave a trace tied to the actor and affected entity.
          - heading "Implementation" [level=2] [ref=f4e107]
          - paragraph [ref=f4e108]: "The implemented flow covers:"
          - list [ref=f4e109]:
            - listitem [ref=f4e110]: drafts and submission for review;
            - listitem [ref=f4e111]: approval or rejection with a persisted reason;
            - listitem [ref=f4e112]: controlled publication;
            - listitem [ref=f4e113]: paginated public catalog with filters;
            - listitem [ref=f4e114]: public listing with availability;
            - listitem [ref=f4e115]: direct contact with the correct owner;
            - listitem [ref=f4e116]: administrative actions with audit records.
          - paragraph [ref=f4e117]: The core stack combines NestJS, Vue, TypeScript, Prisma, and PostgreSQL with a clear separation between API, persistence, and user experience.
          - heading "QA and validation" [level=2] [ref=f4e118]
          - paragraph [ref=f4e119]: The repository includes versioned migrations, API and guard tests, linting, builds, secret validation, and a health smoke test. Documented checkpoints cover catalog, review, availability, contact, and audit workflows.
          - paragraph [ref=f4e120]: Validation focuses especially on authorization boundaries, public responses without internal data, and consistent state transitions.
          - heading "Current result" [level=2] [ref=f4e121]
          - paragraph [ref=f4e122]: The product core is implemented and remains in active development. The platform already models the full journey from listing creation and review through publication, public discovery, and contact without mixing client authority with server authority.
          - heading "Evidence and limits" [level=2] [ref=f4e123]
          - paragraph [ref=f4e124]: Available evidence is in the repository, automated tests, and documented case study. A public verifiable deployment and final visual evidence for the catalog, listing detail, review/publication, and administrative audit remain pending.
          - paragraph [ref=f4e125]:
            - text: The current scope
            - strong [ref=f4e126]: does not include
            - text: reservations, payments, realtime flows, notifications, full tourism operations, or a public production deployment. The demo therefore remains unset and the project is presented as active development rather than a finished production product.
