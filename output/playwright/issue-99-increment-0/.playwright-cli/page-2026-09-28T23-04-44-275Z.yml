          - heading "Software conectado con procesos, integraciones y operación real" [level=2] [ref=f1e220]
        - generic [ref=f1e221]:
          - paragraph [ref=f1e222]: "Mi experiencia incluye SAP Basis, integraciones SAP PI/PO y trabajo con procesos operativos. Ese contexto influye en cómo diseño software: considero actores, excepciones, permisos, trazabilidad, continuidad y calidad de datos desde el comienzo."
          - paragraph [ref=f1e223]: Incorporo IA cuando aporta una ventaja concreta. Combino modelos y agentes con APIs, datos, interfaces, políticas, Human-in-the-Loop, testing, CI/CD y observabilidad para que la automatización opere dentro de límites explícitos.
