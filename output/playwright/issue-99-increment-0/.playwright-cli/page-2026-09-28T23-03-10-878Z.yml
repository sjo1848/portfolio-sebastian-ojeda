        - generic [ref=f1e213]:
          - paragraph [ref=f1e214]: "Mi experiencia incluye SAP Basis, integraciones SAP PI/PO y trabajo con procesos operativos. Ese contexto influye en cómo diseño software: considero actores, excepciones, permisos, trazabilidad, continuidad y calidad de datos desde el comienzo."
          - paragraph [ref=f1e215]: Incorporo IA cuando aporta una ventaja concreta. Combino modelos y agentes con APIs, datos, interfaces, políticas, Human-in-the-Loop, testing, CI/CD y observabilidad para que la automatización opere dentro de límites explícitos.
