    - region [ref=f1e177]:
      - generic [ref=f1e178]:
        - heading "Un poco sobre mí" [level=2] [ref=f1e180]
        - generic [ref=f1e182]:
          - paragraph [ref=f1e183]: "Vivo en Uspallata, Mendoza, Argentina. Antes de concentrarme en el desarrollo de software pasé por soporte, infraestructura, SAP e integraciones en distintos entornos operativos. Ese recorrido fue moldeando mi manera de pensar la tecnología: aprendí a verla como una herramienta para comprender, conectar y mejorar procesos reales, siempre teniendo en cuenta a las personas que los hacen funcionar."
          - paragraph [ref=f1e184]: Disfruto especialmente la etapa de descubrimiento y comprensión del problema. Me resulta muy satisfactorio llegar a algo que todavía no está del todo claro, hacer las preguntas correctas y empezar a entender qué está pasando, por qué funciona de determinada manera, dónde aparecen las fricciones y qué necesita realmente quien lo usa. A partir de ahí, la tecnología empieza a tener sentido. Para mí, una buena solución nace de comprender bien el problema antes de escribir la primera línea de código.
          - paragraph [ref=f1e185]: Aprender es una constante en mi vida. Siempre estoy profundizando algo, descubriendo una herramienta, entrando en un dominio nuevo o tratando de mirar un problema desde otra perspectiva. Puedo estar estudiando arquitectura de software, datos o SAP y después dedicar tiempo a aprender un idioma completamente nuevo. Lo que me mueve no es acumular tecnologías, sino esa satisfacción de comprender algo que antes no entendía y descubrir nuevas formas de pensar, construir y hacer mejor las cosas.
          - paragraph [ref=f1e186]: "Fuera de la pantalla, la montaña ocupa un lugar importante en mi vida. Disfruto correr, caminar, explorar y estar cerca de un entorno que contrasta bastante con pasar horas construyendo sistemas. Elegir vivir en Uspallata tiene mucho que ver con eso: poder desarrollar tecnología sin alejarme del mundo real, de la naturaleza y de las cosas que también despiertan mi curiosidad."
