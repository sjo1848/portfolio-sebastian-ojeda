name: Orchestrate npm lockfile setup

on:
  push:
    branches:
      - chore/reproducible-dependencies
  workflow_dispatch:

permissions:
  contents: write

jobs:
  orchestrate:
    name: Generate, validate and finalize lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/reproducible-dependencies
          fetch-depth: 0

      - name: Synchronize current branch
        run: git pull --rebase origin chore/reproducible-dependencies

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Generate package-lock.json when missing
        shell: bash
        run: |
          if [[ ! -s package-lock.json ]]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          test -s package-lock.json
          node -e "const lock=require('./package-lock.json'); if(lock.lockfileVersion !== 3) process.exit(1)"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Astro check
        run: npm run check

      - name: Production build
        env:
          PUBLIC_SITE_URL: https://portfolio-preview.invalid
        run: npm run build

      - name: Remove temporary workflows
        shell: bash
        run: |
          for file in \
            .github/workflows/generate-lockfile.yml \
            .github/workflows/commit-lockfile.yml \
            .github/workflows/finalize-lockfile.yml \
            .github/workflows/orchestrate-lockfile.yml; do
            if [[ -f "$file" ]]; then
              git rm "$file"
            fi
          done

      - name: Commit finalized dependency state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo "No dependency changes remain."
            exit 0
          fi
          git commit -m "chore: finalize reproducible dependency setup"
          git pull --rebase origin chore/reproducible-dependencies
          git push origin HEAD:chore/reproducible-dependencies
