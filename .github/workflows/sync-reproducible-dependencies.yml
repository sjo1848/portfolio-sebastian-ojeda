name: Sync reproducible dependencies

on:
  push:
    branches:
      - qa/release-readiness
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync parent dependency state
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          ref: qa/release-readiness
          fetch-depth: 0

      - name: Wait for parent lockfile
        shell: bash
        run: |
          found=false
          for attempt in $(seq 1 30); do
            git fetch origin chore/reproducible-dependencies
            if git cat-file -e origin/chore/reproducible-dependencies:package-lock.json 2>/dev/null; then
              found=true
              break
            fi
            sleep 10
          done
          if [[ "$found" != "true" ]]; then
            echo "The parent branch did not produce package-lock.json in time." >&2
            exit 1
          fi

      - name: Import reproducible dependency files
        run: |
          git checkout origin/chore/reproducible-dependencies -- package-lock.json .github/workflows/ci.yml

      - name: Remove temporary workflow
        run: git rm .github/workflows/sync-reproducible-dependencies.yml

      - name: Commit synchronized state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/ci.yml
          git commit -m "chore: sync reproducible dependency baseline"
          git push origin HEAD:qa/release-readiness
