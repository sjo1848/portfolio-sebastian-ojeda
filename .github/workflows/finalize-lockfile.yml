name: Finalize npm lockfile setup

on:
  push:
    branches:
      - chore/reproducible-dependencies
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    name: Validate and remove temporary generators
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/reproducible-dependencies

      - name: Require generated lockfile
        run: test -s package-lock.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Astro check
        run: npm run check

      - name: Production build
        env:
          PUBLIC_SITE_URL: https://portfolio-preview.invalid
        run: npm run build

      - name: Remove temporary workflows
        run: |
          git rm .github/workflows/generate-lockfile.yml
          git rm .github/workflows/commit-lockfile.yml
          git rm .github/workflows/finalize-lockfile.yml

      - name: Commit finalized setup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: finalize reproducible dependency setup"
          git push origin HEAD:chore/reproducible-dependencies
