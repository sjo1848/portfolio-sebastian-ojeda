name: Vendor project media

on:
  push:
    branches:
      - fix/local-project-media
    paths:
      - scripts/vendor-project-media.sh
      - .github/workflows/vendor-project-media.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download immutable project evidence
        run: bash scripts/vendor-project-media.sh

      - name: Commit vendored media
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- public/media/projects)" ]]; then
            echo "Project media already vendored."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/projects
          git commit -m "chore: vendor visible project evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
