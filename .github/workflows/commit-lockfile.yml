name: Commit npm lockfile

on:
  push:
    branches:
      - chore/reproducible-dependencies
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate and commit lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/reproducible-dependencies

      - name: Check current state
        id: state
        shell: bash
        run: |
          if [[ -s package-lock.json ]]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.state.outputs.required == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Generate package-lock.json
        if: steps.state.outputs.required == 'true'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate generated lockfile
        if: steps.state.outputs.required == 'true'
        run: |
          test -s package-lock.json
          node -e "const lock=require('./package-lock.json'); if(lock.lockfileVersion !== 3) process.exit(1)"

      - name: Commit lockfile
        if: steps.state.outputs.required == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: commit reproducible npm lockfile"
          git push origin HEAD:chore/reproducible-dependencies
